name: proyecto-opensource1

services:
  blazor:
    build:
      context: .
      dockerfile: Dockerfile.blazor
    image: ggeasy75/opensource:blazor
    container_name: Proyecto-OpenSource1-blazor
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=AxionERP_App;Username=Rainiery;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=AxionERP_Identity;Username=Rainiery;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      Jwt__Issuer: OpenSource1.Local
      Jwt__Audience: OpenSource1.Local
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a local .env file}"
      Jwt__ExpirationMinutes: 120
      Cors__AllowedOrigins__0: http://localhost:8080
      Api__BaseAddress: http://api:8080/
      Database__ApplyMigrationsOnStartup: "false"
    ports:
      - "8080:8080"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
      - uploads-data:/app/storage/uploads
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ggeasy75/opensource:api
    container_name: Proyecto-OpenSource1-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=AxionERP_App;Username=Rainiery;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=AxionERP_Identity;Username=Rainiery;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      Jwt__Issuer: OpenSource1.Local
      Jwt__Audience: OpenSource1.Local
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a local .env file}"
      Jwt__ExpirationMinutes: 120
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:8081
      Database__ApplyMigrationsOnStartup: "true"
      UserSeed__Enabled: "true"
      UserSeed__DefaultPassword: "${AUTH_SEED_DEFAULT_PASSWORD:?Set AUTH_SEED_DEFAULT_PASSWORD in a local .env file}"
      UserSeed__ResetPasswords: "${AUTH_SEED_RESET_PASSWORDS:-false}"
    ports:
      - "8081:8080"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: Proyecto-OpenSource1-postgres
    environment:
      POSTGRES_USER: Rainiery
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Rainiery -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  dataprotection-keys:
  uploads-data:
