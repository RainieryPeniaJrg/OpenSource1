name: axion-production
services:
  proxy:
    image: caddy:2-alpine
    environment:
      AXION_HOST: ${AXION_HOST:?Set the public DNS hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    networks:
      edge:
        ipv4_address: 172.29.77.10
    depends_on: [blazor]
  blazor:
    build: { context: ., dockerfile: Dockerfile.blazor }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${AXION_HOST}
      Api__BaseAddress: http://api:8080/
      ReverseProxy__KnownProxies__0: 172.29.77.10
    networks: [edge, backend]
    volumes:
      - keys:/root/.aspnet/DataProtection-Keys
      - uploads:/app/storage/uploads
    depends_on: [api]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=AxionERP_App;Username=Rainiery;Password=${POSTGRES_PASSWORD:?Set private DB password}
      ConnectionStrings__IdentityConnection: Host=postgres;Database=AxionERP_Identity;Username=Rainiery;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: AxionERP.Production
      Jwt__Audience: AxionERP.Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set a random signing key}
      Cors__AllowedOrigins__0: https://${AXION_HOST}
      Database__ApplyMigrationsOnStartup: "false"
      Database__RecreateOnPendingModelChangesInDevelopment: "false"
      UserSeed__Enabled: "false"
    networks: [backend]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: Rainiery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    networks: [backend]
networks:
  edge:
    ipam:
      config: [{ subnet: 172.29.77.0/24 }]
  backend:
    internal: true
volumes:
  postgres:
  keys:
  uploads:
  tls-data:
  tls-config:
